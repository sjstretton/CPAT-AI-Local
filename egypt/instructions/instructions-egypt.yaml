# Egypt CBAM / industry task instructions (machine-readable)
# See context-egypt.md for background, file locations and definitions.
schema_version: 1
project: egypt-cbam-industry
created: 2026-10-02
context_file: egypt/instructions/context-egypt.md
working_folder: egypt/

goals:
  - Redo off-CPAT (ad hoc) Egypt calculations that contain substantial errors.
  - In parallel, build an AI-coded prototype of CPAT, starting ONLY with the CBAM-related industrial modules.
  - Prototype location: cpat_excel_new/standalone_working_version/ (final version CPAT_Industry_Kernel_Egypt_v1.3.xlsx, sheet CarveOut_Table2 = final Table 2; older versions in Old/).

global_constraints:
  - Scope is limited to CBAM-related industrial modules of CPAT for the prototype.
  - "Legacy CPAT workbook is the reference: cpat_excel_original/CPAT 1.0pre_456_NoPropData.xlsb."
  - Do not modify files in cpat_excel_original/ or egypt/supporting/InitialResultsAndIssues/ (source/reference material).
  - Working outputs for Egypt go in egypt/.
  - Follow repo NORMS.md.

parallelism:
  initial_parallel_tasks: [TASK-1, TASK-2a]
  note: "TASK-1 and TASK-2a are expected to run in parallel soon; TASK-0 is done first."

tasks:
  - id: TASK-0
    title: Save instructions
    status: done
    description: >
      Save the originating prompt as machine-readable instructions (this file) plus an explicit
      context file (context-egypt.md) in instructions/. Do nothing else.
    outputs:
      - egypt/instructions/instructions-egypt.yaml
      - egypt/instructions/context-egypt.md

